# ETF 策略配置文件 - 改进版（减少重复）
# 保持所有参数值与原始文件完全一致

# 通用默认配置
defaults: &defaults
  # 基础配置
  clientOrderId: "1655"
  apikey: "APIKey.json"
  bnsymbol: "STGUSDT"
  currencies: ["USDT", "STG5L", "STG5S", "STG3L", "STG3S"]
  
  # 精度设置
  precision: 6
  prec_amount: 2
  precision_amount: 0
  precision_price: 4
  
  # 时间间隔（秒）- 通用默认值
  Hedging_interval: 20
  kline_continuity_interval: 60
  
  # 功能开关 - 通用默认值
  Enable_risk_controller: false
  Enable_wash_trading: true
  Enable_hedging: false
  Enable_market_making: true
  cancel_all_open_orders: false
  pre_make_orders: false
  Exit_with_cancel_all_open_orders: false
  
  # 交易参数 - 通用默认值
  leverage: 5
  wash: "mid_price"
  anti_pin_usdt: 300
  anti_pin_rate: 0.2
  
  # 净值计算参数 - 通用默认值
  net_value_interval: 1    # 净值更新间隔（秒）
  init_net_value: 1.0      # 初始净值
  daily_fee: 0.001         # 日管理费率
  rebalance_threshold: 0.05 # 再平衡阈值
  max_single_change: 0.10  # 最大单次变化率限制
  max_restart_gap: 300     # 最大重启间隔（秒）

# 3x杠杆默认配置
defaults_3x: &defaults_3x
  <<: *defaults
  sleep_interval: 10       # 主循环间隔 - 中频
  washing_interval: 30     # 洗盘间隔 - 减少自成交
  bid_ask_spread: 0.008    # 0.8%价差，吸引真实交易

# 5x杠杆默认配置
defaults_5x: &defaults_5x
  <<: *defaults
  sleep_interval: 15       # 主循环间隔 - 低频（高杠杆更谨慎）
  washing_interval: 60     # 洗盘间隔 - 大幅减少自成交
  bid_ask_spread: 0.015    # 1.5%价差，高杠杆需要更大保护

strategies:
  stg3l:
    <<: *defaults_3x
    prefix: "stg3l"
    env: "qa"
    
  stg3s:
    <<: *defaults_3x
    prefix: "stg3s"
    env: "prod"
    
  stg5l:
    <<: *defaults_5x
    prefix: "stg5l"
    env: "prod"
    cancel_all_open_orders: true    # STG5L 特有：启动时取消所有订单
    
  stg5s:
    <<: *defaults_5x
    prefix: "stg5s"
    env: "prod"
    bid_ask_spread: 0.05    # STG5S 特有：保持5%价差（做空风险更高）