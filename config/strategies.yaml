# ETF 策略配置文件
# 保持所有参数值与原始文件完全一致

strategies:
  ton3l:
    # 基础配置 - TON 3倍做多策略
    prefix: "ton3l"
    env: "qa"
    clientOrderId: "1655"
    apikey: "APIKey.json"
    bnsymbol: "TONUSDT"
    currencies: ["USDT", "TON3L", "TON3S"]

    # 精度设置
    precision: 6
    prec_amount: 2
    precision_amount: 0
    precision_price: 4

    # 时间间隔（秒）- 中低频优化
    sleep_interval: 10       # 主循环间隔
    Hedging_interval: 20
    washing_lambda: 10       # ✅ 洗盘平均间隔（秒）→ 1/10 = 10%/秒 → 1分钟约6次（确保K线数据充足）
    kline_continuity_interval: 60

    # K线优化参数（新增）
    kline_price_volatility: 0.001     # K线价格波动范围 ±0.1%
    trend_switch_interval: 300        # 趋势切换间隔（秒） 5分钟
    trend_up_prob: 0.15               # 上涨趋势概率 15%
    trend_down_prob: 0.15             # 下跌趋势概率 15%
    trend_oscillate_prob: 0.70        # 震荡概率 70%

    # 分笔成交参数（方案3：最真实K线）
    micro_trades_count: 4             # 每次洗盘的小单数量（默认随机3-5笔）

    # 功能开关
    Enable_risk_controller: false   # ❌ 临时禁用（已修复 Level 2 逻辑，待测试后启用）
    Enable_wash_trading: true
    Enable_hedging: false
    Enable_market_making: true

    # 交易参数
    leverage: 3
    wash: "mid_price"
    anti_pin_usdt: 300
    anti_pin_rate: 0.2
    bid_ask_spread: 0.008    # 0.8% 价差

    # 订单更新控制参数
    price_change_threshold: 0.003  # 价格变化阈值 0.3%（减少不必要的订单更新）
    min_update_interval: 30        # 最小更新间隔 30秒（防止过于频繁更新）

    # ========== 订单簿算法配置 ==========
    orderbook_algorithm: "layered"     # ✅ 使用分层订单簿算法（减少70%+ API调用）
    orderbook_config:
      total_budget: 10000.0            # 总预算 10000 USDT
      layer: 200                       # 总档位200档（避免ORDER_006挂单过多错误）

      # 3层订单簿配置（适合3x杠杆，按比例缩减至200档）
      near_book:
        distance_threshold: 0.005      # 近盘口：净值±0.5%
        layer_count: 20                # 20档（买10 + 卖10）
        price_tolerance: 0.001         # 价格匹配容差 0.1%
        update_interval: 30            # 更新间隔 30秒
        price_change_trigger: 0.002    # 触发阈值 0.2%
        budget_ratio: 0.3              # 30%预算

      transition_zone:
        distance_range: [0.005, 0.02]  # 过渡区：0.5%-2%
        layer_count: 60                # 60档（买30 + 卖30）
        price_tolerance: 0.003         # 价格匹配容差 0.3%
        update_interval: 60            # 更新间隔 60秒
        price_change_trigger: 0.005    # 触发阈值 0.5%
        budget_ratio: 0.4              # 40%预算

      far_book:
        distance_range: [0.02, 0.10]   # 远盘口：2%-10%
        layer_count: 120               # 120档（买60 + 卖60）
        price_tolerance: 0.01          # 价格匹配容差 1%
        update_interval: 180           # 更新间隔 180秒
        price_change_trigger: 0.01     # 触发阈值 1%
        budget_ratio: 0.3              # 30%预算

    # 净值计算参数
    net_value_interval: 1    # 净值更新间隔（秒）
    init_net_value: 1.0      # 初始净值
    daily_fee: 0.001         # 日管理费率
    rebalance_threshold: 0.05 # 再平衡阈值
    max_single_change: 0.10  # 最大单次变化率限制
    max_restart_gap: 300     # 最大重启间隔（秒）


    # 资金检查配置
    balance_check:
      enabled: true                   # 是否启用资金检查
      warning_threshold: 0.3          # 警告阈值（剩余资金比例30%）
      critical_threshold: 0.2         # 危急阈值（剩余资金比例20%）
      insufficient_threshold: 0.1     # 不足阈值（剩余资金比例10%）
      check_interval: 60              # 检查间隔（秒）


