# ETF 策略全局配置
# 各策略特定配置放在 config/<strategy>.yaml 中，会覆盖此处的默认值

# ========================================
# 全局默认配置
# ========================================
defaults:
  # 环境配置
  env: "prod"
  clientOrderId: "1655"

  # 时间间隔（秒）
  sleep_interval: 10           # 主循环间隔
  Hedging_interval: 20         # 对冲间隔
  washing_lambda: 10           # 洗盘平均间隔（默认10秒）
  
  # 订单簿预设
  orderbook_preset: "layered"  # 默认使用layered预设
  kline_continuity_interval: 60

  # 洗盘成交量配置
  enable_volume_target: true
  min_wash_volume: 30.0        # 最小成交量 (USDT)
  max_wash_volume: 25000.0     # 最大成交量 (USDT)
  volume_trend_momentum: 0.25  # 趋势延续强度

  # K线优化参数
  kline_price_volatility: 0.001    # K线价格波动范围 ±0.1%
  trend_switch_interval: 300       # 趋势切换间隔（秒）
  trend_up_prob: 0.15              # 上涨趋势概率
  trend_down_prob: 0.15            # 下跌趋势概率
  trend_oscillate_prob: 0.70       # 震荡概率
  micro_trades_count: 4            # 每次洗盘的小单数量

  # 功能开关
  Enable_risk_controller: false    # 风险控制器
  Enable_wash_trading: true        # 洗盘交易
  Enable_hedging: false            # 对冲
  Enable_market_making: true       # 做市

  # 交易参数
  wash: "mid_price"
  anti_pin_usdt: 300
  anti_pin_rate: 0.2
  bid_ask_spread: 0.008            # 默认 0.8% 价差

  # 分层订单调整配置
  layer_adjustment:
    enabled: true                    # 是否启用分层调整
    near_book:                       # 近盘口 (NAV ±0.5%)
      min_depth: 100                 # 最小深度 (USDT)
      max_imbalance: 0.30            # 最大不平衡度 30%
      max_density: 0.002             # 最大价格间隔 0.2%
      target_spread: 0.008           # 目标价差（继承 bid_ask_spread）
    mid_book:                        # 中盘口 (0.5%-2%)
      min_depth: 200                 # 最小深度 (USDT)
      max_imbalance: 0.50            # 最大不平衡度 50%
    far_book:                        # 远盘口 (2%-10%)
      min_count: 10                  # 最小订单数
      max_imbalance: 0.60            # 最大不平衡度 60%


  # 分层平衡管理器配置（新增）
  balance_manager:
    enabled: true
    
    global:
      order_limit: 200             # XT交易所订单上限
      safety_margin: 5             # 安全余量
      antipin_reserve: 5           # 反针对预留
      check_interval: 5            # 检查间隔（秒）
    
    layers:
      near:
        range: [0, 0.005]          # NAV ±0.5%
        imbalance_threshold: 0.10  # 10%触发调整
        max_allowed_imbalance: 0.20
        force_best_price: true     # 硬性保证买一卖一
        priority: 100
        max_adjustment_per_cycle: 5
        bid_ask_spread: 0.008      # 继承主配置
      
      mid:
        range: [0.005, 0.02]       # 0.5%-2%
        imbalance_threshold: 0.10
        max_allowed_imbalance: 0.30
        priority: 50
        max_adjustment_per_cycle: 8
      
      far:
        range: [0.02, 0.10]        # 2%-10%
        imbalance_threshold: 0.20  # 远盘口允许更大不平衡
        max_allowed_imbalance: 0.50
        priority: 20
        max_adjustment_per_cycle: 10
        defense_mode: true         # 防御优先：主要删除超额
    
    reliability:
      protect_best_orders: true    # 保护买一卖一
      protect_count: 2             # 保护前2档
      max_retries: 3
      emergency_repair_enabled: true

  # 订单更新控制
  price_change_threshold: 0.001    # 价格变化阈值 0.1%（从0.3%降低，确保近盘口及时更新）
  min_update_interval: 15          # 最小更新间隔（秒）（从30秒降低到15秒）
  
  # 近盘口强制对齐配置（新增）
  near_book_alignment:
    enabled: true                  # 启用近盘口强制对齐
    max_deviation: 0.002           # 最大允许偏差 0.2%（超过则强制修复）
    force_repair: true             # 超过偏差时强制修复
    check_on_every_update: true    # 每次更新都检查

  # 订单簿算法配置
  orderbook_algorithm: "natural"
  orderbook_config:
    total_budget: 10000.0
    layer: 200                     # 总档位（避免ORDER_006错误）
    extra_params:
      naturalness: "high"

  # 净值计算参数
  net_value_interval: 1            # 净值更新间隔（秒）
  init_net_value: 1.0              # 初始净值
  daily_fee: 0.001                 # 日管理费率
  rebalance_threshold: 0.05        # 再平衡阈值
  max_single_change: 0.10          # 最大单次变化率
  max_restart_gap: 300             # 最大重启间隔（秒）

  # 资金检查配置
  balance_check:
    enabled: true
    warning_threshold: 0.3         # 警告阈值 30%
    critical_threshold: 0.2        # 危急阈值 20%
    insufficient_threshold: 0.1    # 不足阈值 10%
    check_interval: 60             # 检查间隔（秒）

# ========================================
# 订单簿算法预设
# ========================================
orderbook_presets:
  # 分层订单簿（适合需要精细控制的策略）
  layered:
    orderbook_algorithm: "layered"
    orderbook_config:
      total_budget: 10000.0
      layer: 200
      near_book:
        distance_threshold: 0.005    # 净值±0.5%
        layer_count: 20
        price_tolerance: 0.001
        update_interval: 30
        price_change_trigger: 0.002
        budget_ratio: 0.3
      transition_zone:
        distance_range: [0.005, 0.02]
        layer_count: 60
        price_tolerance: 0.003
        update_interval: 60
        price_change_trigger: 0.005
        budget_ratio: 0.4
      far_book:
        distance_range: [0.02, 0.10]
        layer_count: 120
        price_tolerance: 0.01
        update_interval: 180
        price_change_trigger: 0.01
        budget_ratio: 0.3

  # 自然分布订单簿（默认）
  natural:
    orderbook_algorithm: "natural"
    orderbook_config:
      total_budget: 10000.0
      layer: 200
      extra_params:
        naturalness: "high"

# ========================================
# 数据库配置
# ========================================
database:
  # PostgreSQL 连接配置（通过环境变量设置）
  # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB

  net_value_persistence:
    enabled: true
    batch_size: 40               # 批量大小
    flush_interval: 10           # 刷新间隔（秒）
    enable_partitioning: false   # 月度分区（生产推荐启用）

  order_persistence:
    enabled: false               # 当前使用CSV降级
