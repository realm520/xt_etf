# ETF 策略配置文件
# 保持所有参数值与原始文件完全一致

strategies:
  stg3l:
    # 基础配置
    prefix: "stg3l"
    env: "qa"
    clientOrderId: "1655"
    apikey: "APIKey.json"
    bnsymbol: "STGUSDT"
    currencies: ["USDT", "STG5L", "STG5S", "STG3L", "STG3S"]

    # 精度设置
    precision: 6
    prec_amount: 2
    precision_amount: 0
    precision_price: 4

    # 时间间隔（秒）- 中低频优化
    sleep_interval: 10       # 主循环间隔 - 从5秒改为10秒
    Hedging_interval: 20
    washing_interval: 30     # 洗盘间隔 - 从5秒改为30秒，减少自成交
    kline_continuity_interval: 60

    # 功能开关
    Enable_risk_controller: true    # ✅ 启用风险控制器（3x杠杆）
    Enable_wash_trading: true
    Enable_hedging: false
    Enable_market_making: true
    cancel_all_open_orders: false
    pre_make_orders: false
    Exit_with_cancel_all_open_orders: false

    # 交易参数
    leverage: 5
    wash: "mid_price"
    anti_pin_usdt: 300
    anti_pin_rate: 0.2
    bid_ask_spread: 0.008    # 从1%改为0.8%，吸引真实交易

    # 净值计算参数
    net_value_interval: 1    # 净值更新间隔（秒）
    init_net_value: 1.0      # 初始净值
    daily_fee: 0.001         # 日管理费率
    rebalance_threshold: 0.05 # 再平衡阈值
    max_single_change: 0.10  # 最大单次变化率限制
    max_restart_gap: 300     # 最大重启间隔（秒）
    
    # 止损配置
    stop_loss:
      enabled: true          # 是否启用止损
      fixed_threshold: -0.02 # 固定止损阈值 -2%
      trailing_stop: 0.01    # 移动止损 1%
      time_stop: 24          # 时间止损（小时）
      cooldown: 60           # 止损后冷却时间（分钟）
      enable_partial_close: true  # 是否启用部分平仓

  stg3s:
