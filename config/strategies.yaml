# ETF 策略配置文件
# 保持所有参数值与原始文件完全一致

strategies:
  stg3l:
    # 基础配置
    prefix: "stg3l"
    env: "prod"
    clientOrderId: "1655"
    apikey: "APIKey.json"
    bnsymbol: "STGUSDT"
    currencies: ["USDT", "STG5L", "STG5S", "STG3L", "STG3S"]
    
    # 精度设置
    precision: 6
    prec_amount: 2
    precision_amount: 0
    precision_price: 4
    
    # 时间间隔（秒）
    sleep_interval: 5        # 主循环间隔 - STG3L 特有的5秒
    Hedging_interval: 20
    washing_interval: 5      # 洗盘间隔 - STG3L 特有的5秒
    kline_continuity_interval: 60
    
    # 功能开关
    Enable_risk_controller: false
    Enable_wash_trading: true
    Enable_hedging: false
    Enable_market_making: true
    cancel_all_open_orders: false
    pre_make_orders: false
    Exit_with_cancel_all_open_orders: false
    
    # 交易参数
    leverage: 5
    wash: "mid_price"
    anti_pin_usdt: 300
    anti_pin_rate: 0.2
    bid_ask_spread: 0.01
    
  stg3s:
    # 基础配置
