# ETF 策略全局配置
# 各策略特定配置放在 config/<strategy>.yaml 中，会覆盖此处的默认值

# ========================================
# 全局默认配置
# ========================================
defaults:
  # 环境配置
  env: "prod"
  clientOrderId: "1655"

  # 时间间隔（秒）
  sleep_interval: 10           # 主循环间隔
  Hedging_interval: 20         # 对冲间隔
  washing_lambda: 10           # 洗盘平均间隔（默认10秒）
  
  # K线连续性配置
  kline_continuity_interval: 60

  # 洗盘成交量配置
  enable_volume_target: true
  min_wash_volume: 30.0        # 最小成交量 (USDT)
  max_wash_volume: 25000.0     # 最大成交量 (USDT)
  volume_trend_momentum: 0.25  # 趋势延续强度

  # K线优化参数
  kline_price_volatility: 0.001    # K线价格波动范围 ±0.1%
  trend_switch_interval: 300       # 趋势切换间隔（秒）
  trend_up_prob: 0.15              # 上涨趋势概率
  trend_down_prob: 0.15            # 下跌趋势概率
  trend_oscillate_prob: 0.70       # 震荡概率
  micro_trades_count: 4            # 每次洗盘的小单数量

  # 功能开关
  Enable_risk_controller: false    # 风险控制器
  Enable_wash_trading: true        # 洗盘交易
  Enable_hedging: false            # 对冲
  Enable_market_making: true       # 做市

  # 交易参数
  wash: "mid_price"
  anti_pin_usdt: 300
  anti_pin_rate: 0.2
  bid_ask_spread: 0.008            # 默认 0.8% 价差

  # ========================================
  # Maintainer 订单簿维护系统配置
  # ========================================
  orderbook_maintainer:
    enabled: true                  # 默认启用
    spread: 0.005                  # 买卖价差 0.5%
    max_distance: 0.10             # 最大距离（相对于NAV）
    total_budget: 15000            # 总预算 (USDT)
    min_order_value: 10            # 最小订单金额
    min_price_change: 0.001        # 0.1% 变化触发更新
    max_operations_per_cycle: 100  # 每周期最大操作数
    max_orders: 200                # 最大订单数（XT交易所限制）
    order_overflow_threshold: 0.85 # 订单溢出阈值

    # 近盘口配置（等差分布，密集）
    near_layer:
      distance_min: 0              # 从 spread/2 开始
      distance_max: 0.03           # 到 NAV ±3%
      order_count: 50              # 单边 50 档
      budget_ratio: 0.5            # 占总预算 50%
      distribution: "arithmetic"   # 等差分布

    # 远盘口配置（等比分布，稀疏）
    far_layer:
      distance_min: 0.03           # 从 3% 开始
      distance_max: 0.10           # 到 NAV ±10%
      order_count: 50              # 单边 50 档
      budget_ratio: 0.5            # 占总预算 50%
      distribution: "geometric"    # 等比分布

  # 净值计算参数
  net_value_interval: 1            # 净值更新间隔（秒）
  init_net_value: 1.0              # 初始净值
  daily_fee: 0.001                 # 日管理费率
  rebalance_threshold: 0.05        # 再平衡阈值
  max_single_change: 0.10          # 最大单次变化率
  max_restart_gap: 300             # 最大重启间隔（秒）

  # 资金检查配置
  balance_check:
    enabled: true
    warning_threshold: 0.3         # 警告阈值 30%
    critical_threshold: 0.2        # 危急阈值 20%
    insufficient_threshold: 0.1    # 不足阈值 10%
    check_interval: 60             # 检查间隔（秒）

# ========================================
# 数据库配置
# ========================================
database:
  # PostgreSQL 连接配置（通过环境变量设置）
  # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB

  net_value_persistence:
    enabled: true
    batch_size: 40               # 批量大小
    flush_interval: 10           # 刷新间隔（秒）
    enable_partitioning: false   # 月度分区（生产推荐启用）

  order_persistence:
    enabled: false               # 当前使用CSV降级

# ========================================
# 策略特定配置（按需覆盖全局默认值）
# ========================================
strategies:
  # TON 3x 做多策略
  ton3l: {}  # 使用全局默认配置

  # TON 3x 做空策略
  ton3s: {}  # 使用全局默认配置
