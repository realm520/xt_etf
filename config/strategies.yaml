# ETF 策略配置文件
# 保持所有参数值与原始文件完全一致

strategies:
  ton3l:
    # 基础配置 - TON 3倍做多策略
    prefix: "ton3l"
    env: "qa"
    clientOrderId: "1655"
    apikey: "APIKey.json"
    bnsymbol: "TONUSDT"
    currencies: ["USDT", "TON3L", "TON3S"]

    # 精度设置
    precision: 6
    prec_amount: 2
    precision_amount: 0
    precision_price: 4

    # 时间间隔（秒）- 中低频优化
    sleep_interval: 10       # 主循环间隔
    Hedging_interval: 20
    washing_interval: 30     # 洗盘间隔
    kline_continuity_interval: 60

    # 功能开关
    Enable_risk_controller: true    # ✅ 启用风险控制器（3x杠杆）
    Enable_wash_trading: true
    Enable_hedging: false
    Enable_market_making: true
    cancel_all_open_orders: true
    # ❌ pre_make_orders: false  # 已废弃 (2025-11-21)
    Exit_with_cancel_all_open_orders: false

    # 交易参数
    leverage: 3
    wash: "mid_price"
    anti_pin_usdt: 300
    anti_pin_rate: 0.2
    bid_ask_spread: 0.008    # 0.8% 价差

    # 净值计算参数
    net_value_interval: 1    # 净值更新间隔（秒）
    init_net_value: 1.0      # 初始净值
    daily_fee: 0.001         # 日管理费率
    rebalance_threshold: 0.05 # 再平衡阈值
    max_single_change: 0.10  # 最大单次变化率限制
    max_restart_gap: 300     # 最大重启间隔（秒）

    # 止损配置
    stop_loss:
      enabled: true          # 是否启用止损
      fixed_threshold: -0.02 # 固定止损阈值 -2%
      trailing_stop: 0.01    # 移动止损 1%
      time_stop: 24          # 时间止损（小时）
      cooldown: 60           # 止损后冷却时间（分钟）
      enable_partial_close: true  # 是否启用部分平仓

    # ✅ 自然K线模拟器配置（优化后）
    natural_kline:
      enabled: true                   # 是否启用自然K线模拟
      kline_period: 60                # K线周期（秒），默认1分钟
      avg_trades_per_period: 8        # 每个周期平均交易次数（从3增加到8）
      volatility: 0.005               # 年化波动率（从0.2%增加到0.5%）
      min_trade_amount: 8             # 最小交易金额（USDT，从5增加到8）
      max_price_change_pct: 0.02      # 单笔最大价格变化（从1%增加到2%）
    
    # 资金检查配置（新增）
    balance_check:
      enabled: true                   # 是否启用资金检查
      warning_threshold: 0.3          # 警告阈值（剩余资金比例30%）
      critical_threshold: 0.2         # 危急阈值（剩余资金比例20%）
      insufficient_threshold: 0.1     # 不足阈值（剩余资金比例10%）
      check_interval: 60              # 检查间隔（秒）


