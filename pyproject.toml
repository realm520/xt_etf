[project]
name = "xt-etf"
version = "1.0.0"
description = "XT ETF 加密货币交易系统"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "aiohttp",
    "dateparser",
    "pycryptodome",
    "requests",
    "websockets",
    "websockets_proxy; python_version >= '3.8'",
    "redis",
    "pyyaml",
    "pandas",
    "numpy",
    "loguru",
    "httpx",
    "aiofiles",
    "sqlalchemy[asyncio]",
    "asyncpg>=0.29.0",
    "tenacity>=8.0.0",
    "tabulate>=0.9.0",
    "superclaude>=3.0.0.1",
    "python-pptx>=1.0.2",
    "python-dotenv>=1.0.0",
    # OpenTelemetry 可观测性
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-instrumentation>=0.41b0",
    "matplotlib>=3.7.5",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-asyncio",
    "pytest-timeout",
    "pytest-xdist",
    "pytest-cov",
    "requests-mock",
    "aioresponses",
    "ruff",
    "pyright",
    "pre-commit",
    "tox",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["etf", "binance"]

[tool.setuptools.package-data]
etf = ["*.yaml", "*.json"]
binance = ["*.json"]

[tool.ruff]
preview = true
lint.ignore = ["F722","F841","F821","E402","E501","E902","E713","E741","E714", "E275","E721","E266", "E261"]

[tool.pytest.ini_options]
timeout = 10
timeout_method = "thread"
addopts = "-n 10 --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (may take more than 1 second)",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "redis_required: marks tests that require Redis",
    "performance: marks tests as performance benchmarks",
    "options: marks tests for options trading functionality",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["etf", "binance"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/conftest.py",
    "*/setup.py",
    "*/venv/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.uv]
# Python 版本管理
managed = true
python-preference = "system"

# 开发依赖（用于 uv sync）
dev-dependencies = [
    "pytest>=6.0",
    "pytest-asyncio",
    "pytest-timeout",
    "pytest-xdist",
    "pytest-cov",
    "requests-mock",
    "aioresponses",
    "ruff",
    "pyright",
    "pre-commit",
    "tox",
]
