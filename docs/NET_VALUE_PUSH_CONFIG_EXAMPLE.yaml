# 净值推送配置示例
# 将此配置块添加到 config/strategies.yaml 中对应策略的配置中

# ==================== 示例1: TON 3倍做多（QA环境）====================
ton3l:
  # ... 其他配置 ...

  # 净值推送配置（推送到交易所）
  net_value_push:
    enabled: true          # 启用推送功能
    interval: 60           # 推送间隔（秒），建议60秒
    host: "https://sapi.xt-qa2.com"  # QA环境
    symbol: "TON3L_USDT"   # 推送到交易所的symbol名称（可选）

# ==================== 示例2: STG 3倍做多（生产环境）====================
stg3l:
  # ... 其他配置 ...

  # 净值推送配置（推送到交易所）
  net_value_push:
    enabled: true          # 启用推送功能
    interval: 60           # 推送间隔（秒）
    host: "https://sapi.xt.com"  # 生产环境
    symbol: "STG3L_USDT"   # 推送到交易所的symbol名称

# ==================== 示例3: 自动生成symbol（推荐）====================
stg5l:
  # ... 其他配置 ...

  # 净值推送配置（推送到交易所）
  net_value_push:
    enabled: true          # 启用推送功能
    interval: 60           # 推送间隔（秒）
    # host 不填，则根据 --env 参数自动选择
    # symbol 不填，则自动从策略名生成（如 stg5l → STG5L_USDT）

# ==================== 示例4: 禁用推送（默认）====================
stg3s:
  # ... 其他配置 ...

  # 净值推送配置（推送到交易所）
  net_value_push:
    enabled: false         # 禁用推送功能

# ==================== 参数说明 ====================
# enabled (必填):
#   - true: 启用推送功能
#   - false: 禁用推送功能
#
# interval (可选，默认60):
#   - 推送间隔（秒）
#   - 建议值: 60秒（平衡实时性和API调用成本）
#   - 最小值: 10秒（避免过度频繁推送）
#
# host (可选):
#   - 交易所API主机地址
#   - QA环境: "https://sapi.xt-qa2.com"
#   - 生产环境: "https://sapi.xt.com"
#   - 不填则根据 --env 参数自动选择
#
# symbol (可选):
#   - 推送到交易所的symbol名称
#   - 格式: "{币种}{杠杆}{方向}_USDT"
#   - 示例: "TON3L_USDT", "STG5S_USDT"
#   - 不填则自动从策略名生成

# ==================== API密钥配置 ====================
# API密钥需要在 APIKey.json 或 APIKey_{strategy}.json 中配置
#
# 单策略格式（APIKey_ton3l.json）:
# {
#   "access_key": "your_access_key",
#   "secret_key": "your_secret_key"
# }
#
# 多策略格式（APIKey.json）:
# {
#   "xt_ton3l": {
#     "access_key": "your_access_key",
#     "secret_key": "your_secret_key"
#   },
#   "xt_stg3l": {
#     "access_key": "another_access_key",
#     "secret_key": "another_secret_key"
#   }
# }

# ==================== 运行命令 ====================
# QA环境:
#   python run_net_value.py --strategy ton3l --env qa
#
# 生产环境:
#   python run_net_value.py --strategy ton3l --env prod
#
# 测试推送（不启动净值计算器）:
#   uv run python tests/test_update_net_worth.py \
#     --symbol TON3L_USDT \
#     --net-worth 1.0234 \
#     --env qa
