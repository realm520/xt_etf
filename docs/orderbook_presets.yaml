# 订单簿算法预设配置
#
# 使用方式：
#   ton3s:
#     orderbook_algorithm: "natural"
#     orderbook_preset: "medium"  # 引用此文件的预设名称

natural:
  # 小账户（100-500 USDT）
  small:
    total_budget: 200
    layer: 1000
    naturalness: "medium"
    price_precision: 6
    quantity_precision: 2

  # 中等账户（500-2000 USDT）- 推荐
  medium:
    total_budget: 1000
    layer: 5000
    naturalness: "high"
    price_precision: 6
    quantity_precision: 2

  # 大账户（2000-10000 USDT）
  large:
    total_budget: 5000
    layer: 20000
    naturalness: "high"
    price_precision: 6
    quantity_precision: 2

  # 超大账户（>10000 USDT）
  xlarge:
    total_budget: 50000
    layer: 100000
    naturalness: "ultra"
    price_precision: 6
    quantity_precision: 2

# 自然度级别说明
naturalness_levels:
  low:
    description: "70%自然度，快速执行，适合测试"
    features:
      - "简单对数正态分布"
      - "无特效（墙/聚集）"
      - "生成速度快"

  medium:
    description: "85%自然度，平衡性能和真实性"
    features:
      - "混合分布（70%小单 + 25%中单 + 5%大单）"
      - "3%订单墙概率"
      - "2倍整数聚集"

  high:
    description: "95%自然度，高度真实，推荐生产使用"
    features:
      - "完整幂律分布（75%小单 + 20%中单 + 5%大单）"
      - "6%订单墙概率"
      - "3倍整数聚集"

  ultra:
    description: "98%自然度，几乎无法分辨，适合大资金"
    features:
      - "完整幂律分布 + 订单生命周期差异"
      - "8%订单墙概率"
      - "5倍整数聚集"
      - "价格空洞（5%概率）"
